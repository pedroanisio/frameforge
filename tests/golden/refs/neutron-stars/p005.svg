<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><rect width="100%" height="100%" fill="white"/><text x="75" y="110.72" text-anchor="start" style="font-family:sans-serif;font-size:16px;fill:#3a5a8c;font-weight:bold">The Edge of Collapse</text><text y="135.32" text-anchor="start" textLength="445" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f"><tspan x="75" style="font-family:serif;font-size:11px;fill:#14161f">There is, however, a ceiling. Above a critical mass — the </tspan><tspan style="font-family:serif;font-size:11px;fill:#14161f;font-weight:bold">Tolman–Oppenheimer–</tspan></text><text y="151.82" text-anchor="start" textLength="445" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f"><tspan x="75" style="font-family:serif;font-size:11px;fill:#14161f;font-weight:bold">Volkoff limit</tspan><tspan style="font-family:serif;font-size:11px;fill:#14161f">, somewhere near two and a quarter times the mass of the Sun — not</tspan></text><text y="168.32" text-anchor="start" textLength="445" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f"><tspan x="75" style="font-family:serif;font-size:11px;fill:#14161f">even the defiance of densely packed neutrons can withstand gravity. Cross that</tspan></text><text y="184.82" text-anchor="start" textLength="445" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f"><tspan x="75" style="font-family:serif;font-size:11px;fill:#14161f">threshold and collapse resumes without end, and the neutron star vanishes be-</tspan></text><text y="201.32" text-anchor="start" style="font-family:serif;font-size:11px;fill:#14161f"><tspan x="75" style="font-family:serif;font-size:11px;fill:#14161f">hind the horizon of a black hole.</tspan></text><text x="86" y="217.82" text-anchor="start" textLength="434" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f">A neutron star therefore occupies a razor&#x27;s edge in the story of matter: the</text><text x="75" y="234.32" text-anchor="start" textLength="445" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f">densest object that can still hold itself up, poised one step short of oblivion.</text><text x="75" y="250.82" text-anchor="start" textLength="445" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f">In its impossible interior, in its clockwork beams, and in the golden debris</text><text x="75" y="267.32" text-anchor="start" textLength="445" lengthAdjust="spacing" style="font-family:serif;font-size:11px;fill:#14161f">of its collisions, it remains one of the most extreme and instructive objects</text><text x="75" y="283.82" text-anchor="start" style="font-family:serif;font-size:11px;fill:#14161f">the universe has to offer.</text><text y="60" text-anchor="start" dominant-baseline="central" style="font-family:sans-serif;font-size:8.5px;fill:#6b7280;letter-spacing:0.6pt;text-transform:uppercase"><tspan x="75">NEUTRON STARS · AN ESSAY</tspan></text><line x1="75" y1="786" x2="520" y2="786" stroke="#d9dee5" stroke-width="0.75"/><text y="784" text-anchor="middle" dominant-baseline="central" style="font-family:sans-serif;font-size:9px;fill:#6b7280"><tspan x="297.5">5</tspan></text></svg>
