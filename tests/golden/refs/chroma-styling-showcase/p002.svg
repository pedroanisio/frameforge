<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842" xml:lang="en-US"><title>CHROMA — advanced styling showcase</title><desc>Exercises the CSS-parity style module: gradients, gradient text, blend modes, filters, transforms, box-shadow, small-caps, text-decoration, styled tables and callouts.</desc><rect width="100%" height="100%" fill="white"/><defs><linearGradient id="g10" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stop-color="#faf7ff"/><stop offset="100%" stop-color="#f0eafd"/></linearGradient><linearGradient id="g11" x1="0%" y1="50%" x2="100%" y2="50%"><stop offset="0%" stop-color="#ff004d"/><stop offset="16%" stop-color="#ff7a00"/><stop offset="33%" stop-color="#ffd400"/><stop offset="50%" stop-color="#14d957"/><stop offset="66%" stop-color="#00c2ff"/><stop offset="83%" stop-color="#2b5bff"/><stop offset="100%" stop-color="#8a2be2"/></linearGradient><filter id="fx1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="30"/><feOffset dx="0" dy="12" result="off"/><feFlood flood-color="rgba(20,18,26,0.28)" flood-opacity="0.25"/><feComposite in2="off" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip12"><rect x="300" y="56" width="180" height="14"/></clipPath></defs><g data-region="cols"><text x="54" y="113.6" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:30px;fill:#14121a;font-weight:800;letter-spacing:0.02em;text-transform:uppercase">On the Physics</text><text x="54" y="145.1" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:30px;fill:#14121a;font-weight:800;letter-spacing:0.02em;text-transform:uppercase">of Iridescence</text><text x="54" y="168.2" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:10px;fill:#7a5cff;font-weight:600;font-variant-caps:all-small-caps;letter-spacing:0.18em">By the Optics Desk</text><text y="189.476" text-anchor="start" textLength="220.2" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="64.3" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:10.3px;fill:#ff2d95;font-weight:800;letter-spacing:0.01em">I</tspan><tspan style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">ridescence is structural color: hue pro-</tspan></text><text y="204.926" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">duced not by pigment but by the way light</tspan></text><text y="220.376" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">interferes with itself across features the</tspan></text><text y="235.826" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">size of its own wavelength. Tilt the surface</tspan></text><text y="251.276" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">and the color shifts — the signature that</tspan></text><text y="266.726" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">geometry, not chemistry, is doing the work.</tspan></text><text x="64.3" y="282.176" text-anchor="start" textLength="220.2" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">In a thin film, light reflects from both</text><text x="54" y="297.626" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">the top and bottom surfaces. The two reflect-</text><text x="54" y="313.076" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">ed waves travel paths that differ by twice</text><text x="54" y="328.526" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">the film thickness, and where that differ-</text><text x="54" y="343.976" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">ence is a whole number of wavelengths the</text><text x="54" y="359.426" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">waves reinforce; elsewhere they cancel. Be-</text><text x="54" y="374.876" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">cause the condition depends on wavelength,</text><text x="54" y="390.326" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">each thickness favors a particular color.</text><rect x="54" y="396.3" width="230.5" height="119.04" rx="8" fill="url(#g10)"/><g role="pullquote"><text x="88" y="424.86" text-anchor="start" textLength="180.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:18px;fill:#7a5cff;font-weight:500;font-style:italic;hanging-punctuation:first">Color you can tilt:</text><text x="70" y="448.62" text-anchor="start" textLength="198.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:18px;fill:#7a5cff;font-weight:500;font-style:italic;hanging-punctuation:first">the hue lives in the</text><text x="70" y="472.38" text-anchor="start" textLength="198.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:18px;fill:#7a5cff;font-weight:500;font-style:italic;hanging-punctuation:first">geometry, not in the</text><text x="70" y="496.14" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:18px;fill:#7a5cff;font-weight:500;font-style:italic;hanging-punctuation:first">pigment.</text></g><text y="528.816" text-anchor="start" textLength="220.2" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="64.3" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">The same mechanism paints the soap bubble,</tspan></text><text y="544.266" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">the beetle&#x27;s shell, and the </tspan><tspan style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#25e0d8;text-decoration:underline wavy #25e0d8 1.4px">compact-disc</tspan></text><text y="559.716" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">sheen. Engineers exploit it deliberately</tspan></text><text y="575.166" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">in </tspan><tspan style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;font-variant-caps:small-caps;letter-spacing:0.04em">dielectric mirrors</tspan><tspan style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">, stacking dozens of</tspan></text><text y="590.616" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">quarter-wave layers so that a chosen band re-</tspan></text><text y="606.066" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">flects almost perfectly while the rest pass-</tspan></text><text y="621.516" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="54" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">es through.</tspan></text><rect x="54" y="627.49" width="230.5" height="95.09" rx="10" fill="#f5f3fb" stroke="#d9d6e0" stroke-width="1"/><g role="note"><text x="77.5" y="648.23" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9.5px;fill:#ffb020;font-weight:800;font-variant-caps:all-small-caps;letter-spacing:0.22em">Field Note</text><text x="77.8" y="662.756" text-anchor="start" textLength="192.7" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:9.8px;fill:#14121a">To see thin-film color at home, float</text><text x="68" y="676.966" text-anchor="start" textLength="202.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:9.8px;fill:#14121a">a drop of oil on a puddle. The film thins</text><text x="68" y="691.176" text-anchor="start" textLength="202.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:9.8px;fill:#14121a">as it spreads, so the bands of color map</text><text x="68" y="705.386" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.8px;fill:#14121a">directly onto thickness.</text></g><text x="64.3" y="736.056" text-anchor="start" textLength="220.2" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">The table below pairs film thickness with</text><text x="54" y="751.506" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">the hue it reflects most strongly at normal</text><text x="54" y="766.956" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">incidence, for a film of refractive index</text><text x="310.5" y="95.476" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">near 1.4.</text><text x="310.5" y="110.926" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;font-weight:700">1.Reflected hue by film thickness (n ≈ 1.4,</text><text x="310.5" y="126.376" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;font-weight:700">normal incidence).</text><rect x="310.5" y="136.35" width="69.15" height="33.75" fill="none"/><text x="314.5" y="148.63" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9px;fill:#ffffff;font-weight:800;letter-spacing:0.06em;text-transform:uppercase">Thickness</text><text x="314.5" y="161.505" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9px;fill:#ffffff;font-weight:800;letter-spacing:0.06em;text-transform:uppercase">(nm)</text><rect x="379.65" y="136.35" width="69.15" height="33.75" fill="none"/><text x="383.65" y="148.63" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9px;fill:#ffffff;font-weight:800;letter-spacing:0.06em;text-transform:uppercase">Reflected</text><text x="383.65" y="161.505" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9px;fill:#ffffff;font-weight:800;letter-spacing:0.06em;text-transform:uppercase">hue</text><rect x="448.8" y="136.35" width="92.2" height="33.75" fill="none"/><text x="452.8" y="148.63" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9px;fill:#ffffff;font-weight:800;letter-spacing:0.06em;text-transform:uppercase">Everyday example</text><rect x="310.5" y="170.1" width="69.15" height="16" fill="none"/><text x="314.5" y="182.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">~110</text><rect x="379.65" y="170.1" width="69.15" height="16" fill="none"/><text x="383.65" y="182.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">violet</text><rect x="448.8" y="170.1" width="92.2" height="16" fill="none"/><text x="452.8" y="182.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">thinning soap</text><rect x="310.5" y="186.1" width="69.15" height="16" fill="none"/><text x="314.5" y="198.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">~180</text><rect x="379.65" y="186.1" width="69.15" height="16" fill="none"/><text x="383.65" y="198.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">blue–cyan</text><rect x="448.8" y="186.1" width="92.2" height="16" fill="none"/><text x="452.8" y="198.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">beetle elytra</text><rect x="310.5" y="202.1" width="69.15" height="16" fill="none"/><text x="314.5" y="214.932" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9.6px;fill:#ff2d95;font-weight:800">~250</text><rect x="379.65" y="202.1" width="69.15" height="16" fill="none"/><text x="383.65" y="214.932" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9.6px;fill:#ff2d95;font-weight:800">green</text><rect x="448.8" y="202.1" width="92.2" height="16" fill="none"/><text x="452.8" y="214.932" text-anchor="start" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:9.6px;fill:#ff2d95;font-weight:800">peacock barbule</text><rect x="310.5" y="218.1" width="69.15" height="16" fill="none"/><text x="314.5" y="230.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">~340</text><rect x="379.65" y="218.1" width="69.15" height="16" fill="none"/><text x="383.65" y="230.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">amber</text><rect x="448.8" y="218.1" width="92.2" height="16" fill="none"/><text x="452.8" y="230.932" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:9.6px;fill:#14121a">oil sheen</text><g transform="translate(425.75,244.1)"><g transform="rotate(-1.5 180 48)"><g filter="url(#fx1)"><rect x="0" y="0" width="360" height="96" rx="12" fill="url(#g11)"/></g></g></g><text x="425.75" y="355.576" text-anchor="middle" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;font-style:italic">1.A continuous visible spectrum rendered as</text><text x="425.75" y="371.026" text-anchor="middle" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;font-style:italic">a single gradient fill — no raster image.</text><text y="398.476" text-anchor="start" textLength="220.2" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="320.8" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">Read the spectrum above as the family of</tspan></text><text y="413.926" text-anchor="start" textLength="230.5" lengthAdjust="spacing" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="310.5" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">hues a single film sweeps through as it</tspan></text><text y="429.376" text-anchor="start" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first"><tspan x="310.5" style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">thickens. </tspan><tspan style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#8a8597;letter-spacing:0.35em;text-transform:uppercase">the geometry is the palette</tspan><tspan style="font-family:Source Serif 4, Georgia, serif;font-size:10.3px;fill:#14121a;hyphens:auto;hanging-punctuation:first">.</tspan></text><line x1="297.5" y1="86" x2="297.5" y2="786" stroke="#d9d6e0" stroke-width="0.5"/><text y="63" text-anchor="start" dominant-baseline="central" style="font-family:Source Serif 4, Georgia, serif;font-size:8.5px;fill:#8a8597;letter-spacing:0.35em;text-transform:uppercase"><tspan x="54">CHROMA</tspan></text><g clip-path="url(#clip12)"><text y="63" text-anchor="start" dominant-baseline="central" style="font-family:Inter, Helvetica Neue, Arial, sans-serif;font-size:11px;fill:#8a8597;font-weight:600;font-variant-caps:all-small-caps;letter-spacing:0.4em"><tspan x="300">Iridescence</tspan></text></g><text y="63" text-anchor="start" dominant-baseline="central" style="font-family:Source Serif 4, Georgia, serif;font-size:8.5px;fill:#8a8597;letter-spacing:0.35em;text-transform:uppercase"><tspan x="441">1</tspan></text></g></svg>
