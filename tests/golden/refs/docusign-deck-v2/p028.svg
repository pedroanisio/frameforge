<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" xml:lang="en-US"><title>France Entity Migration to Oracle Project Kickoff</title><desc>Migrated from FrameForge v1.5 (kind: presentation-deck) to v2.0. Slides became fixed Pages through a shared `deck` master; ellipses converted box-&gt;center/rx/ry; image href-&gt;src; v1 gradients and style keys mapped to v2.</desc><rect width="100%" height="100%" fill="white"/><defs><clipPath id="clip166"><rect x="15" y="62" width="30" height="22"/></clipPath><clipPath id="clip167"><rect x="239" y="146" width="110" height="20"/></clipPath><clipPath id="clip168"><rect x="540" y="291" width="120" height="18"/></clipPath><clipPath id="clip169"><rect x="218" y="455" width="130" height="18"/></clipPath><clipPath id="clip170"><rect x="56" y="502" width="95" height="20"/></clipPath></defs><g id="bg"><rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/></g><g id="super"><text y="30.96" text-anchor="start" style="font-family:primary, sans-serif;font-size:28px;fill:#16002F;font-weight:700"><tspan x="34">Project Management Assistance – Detailed approach</tspan></text></g><g id="step"><text y="78.76" text-anchor="start" style="font-family:primary, sans-serif;font-size:18px;fill:#4B00D8;font-weight:700;font-style:italic"><tspan x="50">IMPLEMENTATION ROADMAP AND PLAN - LOCALIZATION</tspan></text></g><g id="title_rule"><line x1="38" y1="59" x2="900" y2="59" stroke="#4B00D8" stroke-width="1.1"/></g><g id="step_num"><g clip-path="url(#clip166)"><text y="73" text-anchor="middle" dominant-baseline="central" style="font-family:primary, sans-serif;font-size:18px;fill:#4B00D8;font-weight:700"><tspan x="30">5</tspan></text></g></g><g id="step_num_ring"><ellipse cx="30" cy="73" rx="14" ry="14" fill="none" stroke="#4B00D8" stroke-width="3"/></g><g id="process_spine"><line x1="430" y1="98" x2="430" y2="493" stroke="#4B00D8" stroke-width="5"/></g><g id="process_node_objectives"><ellipse cx="430" cy="147" rx="10" ry="10" fill="#FFFFFF" stroke="#4B00D8" stroke-width="6"/></g><g id="process_node_activities"><ellipse cx="430" cy="292" rx="10" ry="10" fill="#FFFFFF" stroke="#4B00D8" stroke-width="6"/></g><g id="process_node_deliverables"><ellipse cx="430" cy="463" rx="10" ry="10" fill="#FFFFFF" stroke="#4B00D8" stroke-width="6"/></g><g id="icon_objectives"><ellipse cx="374" cy="151" rx="24" ry="24" fill="#4B00D8" stroke="#4B00D8" stroke-width="1.5"/></g><g id="icon_objectives_pole"><line x1="363" y1="140" x2="363" y2="164" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_objectives_flag"><path d="M366,140 L388,144 L388,157 L366,153 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_activities"><ellipse cx="500" cy="296" rx="24" ry="24" fill="#4B00D8" stroke="#4B00D8" stroke-width="1.5"/></g><g id="icon_activity_gear_big"><ellipse cx="494" cy="291" rx="7" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_activity_gear_small"><ellipse cx="506.5" cy="295.5" rx="5.5" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_activity_tooth_1"><line x1="486" y1="291" x2="482" y2="291" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_activity_tooth_2"><line x1="494" y1="283" x2="494" y2="279" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_activity_tooth_3"><line x1="512" y1="296" x2="516" y2="296" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_deliverables"><ellipse cx="373" cy="463" rx="24" ry="24" fill="#4B00D8" stroke="#4B00D8" stroke-width="1.5"/></g><g id="icon_deliverables_case"><rect x="360" y="456" width="26" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/></g><g id="icon_deliverables_handle"><line x1="367" y1="456" x2="380" y2="456" stroke="#FFFFFF" stroke-width="3"/></g><g id="icon_deliverables_latch"><line x1="373" y1="453" x2="373" y2="466" stroke="#FFFFFF" stroke-width="2"/></g><g id="obj_label"><g clip-path="url(#clip167)"><text y="156" text-anchor="start" dominant-baseline="central" style="font-family:primary, sans-serif;font-size:16px;fill:#4B00D8;font-weight:700"><tspan x="239">OBJECTIVES</tspan></text></g></g><g id="obj"><text y="150.38" text-anchor="start" style="font-family:primary, sans-serif;font-size:9px;fill:#16002F;font-weight:700"><tspan x="478">Develop an implementation roadmap and plan for French localization</tspan></text></g><g id="body_intro"><text y="203.38" text-anchor="start" style="font-family:primary, sans-serif;font-size:9px;fill:#16002F;font-weight:700"><tspan x="27">Based on the different elements collected in the Gap Analysis for France,</tspan><tspan x="27" dy="11">define the implementation roadmap and resource plan. The below topics need</tspan><tspan x="27" dy="11">to be included in this step :</tspan></text></g><g id="body_bullets"><text x="27" y="257.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">•</text><text x="49" y="257.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">**Implementation Plan:** Build a high-level implementation plan, including</text><text x="49" y="267.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">roadmap, timeline, key milestones, project phases...</text><text x="27" y="277.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">•</text><text x="49" y="277.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">**Resource Plan:** Provide a plan, including the resources required to support</text><text x="49" y="287.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">Localization</text><text x="27" y="297.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">•</text><text x="49" y="297.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">**Risk Management:** Identify potential risks, issues, dependencies and develop</text><text x="49" y="307.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">mitigation strategies</text><text x="27" y="317.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">•</text><text x="49" y="317.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">**Future Architecture Recommendations:** Suggest future state architecture for</text><text x="49" y="327.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">integration and associated systems</text><text x="27" y="337.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">•</text><text x="49" y="337.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">**Stakeholder Alignment:** Ensure all stakeholders are aligned regarding project</text><text x="49" y="347.36" text-anchor="start" style="font-family:primary, sans-serif;font-size:8px;fill:#16002F">scope and timelines</text></g><g id="body_close"><text y="431.38" text-anchor="start" style="font-family:primary, sans-serif;font-size:9px;fill:#16002F"><tspan x="27">Organize a validation session to present and to validate the implementation</tspan><tspan x="27" dy="11">roadmap for French localization.</tspan></text></g><g id="act"><g clip-path="url(#clip168)"><text y="300" text-anchor="start" dominant-baseline="central" style="font-family:primary, sans-serif;font-size:16px;fill:#4B00D8;font-weight:700"><tspan x="540">ACTIVITIES</tspan></text></g></g><g id="right_context_box"><rect x="674" y="188" width="236" height="232" rx="26" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/></g><g id="pre_heading"><text y="244.724" text-anchor="middle" style="font-family:primary, sans-serif;font-size:8.2px;fill:#4B00D8;font-weight:700"><tspan x="789">Prerequisites</tspan></text></g><g id="pre_bullets"><text x="698" y="262.98" text-anchor="start" style="font-family:primary, sans-serif;font-size:6.5px;fill:#16002F">•</text><text x="710" y="262.98" text-anchor="start" style="font-family:primary, sans-serif;font-size:6.5px;fill:#16002F">Agreement on project scope and timelines</text><text x="698" y="270.98" text-anchor="start" style="font-family:primary, sans-serif;font-size:6.5px;fill:#16002F">•</text><text x="710" y="270.98" text-anchor="start" style="font-family:primary, sans-serif;font-size:6.5px;fill:#16002F">Availability of resources and budget for</text><text x="710" y="278.98" text-anchor="start" style="font-family:primary, sans-serif;font-size:6.5px;fill:#16002F">implementation</text></g><g id="cost_heading"><text y="354.724" text-anchor="middle" style="font-family:primary, sans-serif;font-size:8.2px;fill:#4B00D8;font-weight:700"><tspan x="789">Cost drivers</tspan></text></g><g id="cost_bullets"><text x="698" y="372.98" text-anchor="start" style="font-family:primary, sans-serif;font-size:6.5px;fill:#16002F">•</text><text x="710" y="372.98" text-anchor="start" style="font-family:primary, sans-serif;font-size:6.5px;fill:#16002F">2 review and validation meetings</text></g><g id="del_label"><g clip-path="url(#clip169)"><text y="464" text-anchor="start" dominant-baseline="central" style="font-family:primary, sans-serif;font-size:16px;fill:#4B00D8;font-weight:700"><tspan x="218">DELIVERABLES</tspan></text></g></g><g id="del"><text x="452" y="461.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">•</text><text x="461" y="461.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">High-level implementation plan for localization</text><text x="452" y="472.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">•</text><text x="461" y="472.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">Resource plan with high-level implementation cost estimate</text><text x="452" y="483.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">•</text><text x="461" y="483.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">Issues, risks and dependencies</text><text x="452" y="494.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">•</text><text x="461" y="494.82" text-anchor="start" style="font-family:primary, sans-serif;font-size:8.5px;fill:#4B00D8;font-weight:700">Future state architecture recommendations</text></g><g id="logo_mark_bg_36_503"><rect x="36" y="503" width="13" height="13" fill="#4B00FF"/></g><g id="logo_mark_fold_36_503"><path d="M43,503 L51,503 L58,510 L51,517 L43,517 Z" fill="#FF5252"/></g><g id="logo_text_36_503"><g clip-path="url(#clip170)"><text y="520.04" text-anchor="start" style="font-family:primary, sans-serif;font-size:22px;fill:#000000;font-weight:700"><tspan x="56">docusig</tspan><tspan x="56" dy="30.462">n.</tspan></text></g></g><g id="conf_28"><text y="516" text-anchor="middle" dominant-baseline="central" style="font-family:primary, sans-serif;font-size:11px;fill:#666666"><tspan x="480">Docusign Confidential</tspan></text></g></svg>
