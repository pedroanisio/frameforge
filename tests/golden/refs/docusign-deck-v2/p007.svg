ructure</text><text x="64" y="215.12" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:11px;fill:#16002F">•</text><text x="76" y="215.12" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:11px;fill:#16002F">Record to Report (R2R)</text><text x="64" y="230.12" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:11px;fill:#16002F">•</text><text x="76" y="230.12" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:11px;fill:#16002F">Procure to Pay (P2P)</text><text x="64" y="245.12" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:11px;fill:#16002F">•</text><text x="76" y="245.12" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:11px;fill:#16002F">French Supplier Onboarding</text></g><g id="card_1"><rect x="341.333" y="125" width="279.333" height="230" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/></g><g id="card_bar_1"><rect x="341.333" y="125" width="5" height="230" fill="#29B9C6"/></g><g id="card_title_1"><text y="150.48" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:14px;fill:#16002F;font-weight:700"><tspan x="353.333">E-Invoicing (France Only)</tspan></text></g><g id="card_body_1"><text y="184.02" text-anchor="start" style="font-family:Arial, Helvetica, sans-serif;font-size:11px;fill:#16002F"><tspan x="353.333">Localized Compliance Deployment of mandatory</tspan><tspan x="353.333" dy="15">e-invoicing solutions specifically for</tspan><tspan x="353.333" dy="15">French statutory requirements. Grant</tspan><tspan x="353.333" dy="15">Thornton will lead this workstream</tspan></text></g><g id="card_2"><rect x="636.667" y="125" width="279.333" height="230" rx="4" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/></g><g id="card_bar_2"><rect x="636.667" y="125" width="5" height="230" fill="#FF5252"/></g><g id="card_title_2"><text y="150.48" text-anchor="start" styl