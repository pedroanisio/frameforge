<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842" xml:lang="en-US"><title>The Guide to Wireframing — first 20 pages (FrameForge replica)</title><desc>Structural replica of pp. 1–20 of UXPin&#x27;s “The Guide to Wireframing” (Chris Bank). Body text is the real extracted copy; the book&#x27;s photographic/sketch figures are the authors&#x27; copyrighted illustrations, shown as labelled image-placeholders. The cover&#x27;s wireframe mock is rebuilt from primitives. Layout is representative, not pixel-exact.</desc><rect width="100%" height="100%" fill="white"/><defs><clipPath id="clip46"><rect x="50" y="381" width="495" height="12"/></clipPath><clipPath id="clip47"><rect x="505" y="800" width="40" height="14"/></clipPath></defs><g id="main"><text y="73.84" text-anchor="start" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F"><tspan x="50" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F;font-weight:700">High-Fidelity Text </tspan><tspan style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F">is one of several ways you can make a wireframe more</tspan></text><text y="90.84" text-anchor="start" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F"><tspan x="50" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F">realistic without going too granular into the graphical details. This may mean</tspan></text><text y="107.84" text-anchor="start" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F"><tspan x="50" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F">filling in the actual copy, the copy length, ideal font, sizing, and weights.</tspan></text><text y="136.84" text-anchor="start" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F"><tspan x="50" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F;font-weight:700">High-Fidelity Color </tspan><tspan style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F">is another way you can make a wireframe more realistic.</tspan></text><text y="153.84" text-anchor="start" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F"><tspan x="50" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F">This may mean filling in very specific background, button, text, or other</tspan></text><text y="170.84" text-anchor="start" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F"><tspan x="50" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F">colors to emphasize desired actions or user flows beyond what grayscale can</tspan></text><text y="187.84" text-anchor="start" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F"><tspan x="50" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:12px;fill:#3F3F3F">offer. Be careful not to go crazy with the color.</tspan></text><rect x="50" y="207" width="495" height="170" fill="#E6E8EA"/><rect x="279.3" y="278.168" width="36.4" height="27.664" rx="2" fill="none" stroke="#C9CDD1" stroke-width="1.4"/><ellipse cx="289.492" cy="286.904" rx="3.64" ry="3.64" fill="#C9CDD1"/><path d="M 282.212 302.92 L 294.588 291.272 L 301.868 297.824 L 308.42 289.816 L 312.788 302.92 Z" fill="#C9CDD1"/><g clip-path="url(#clip46)"><text y="387" text-anchor="start" dominant-baseline="central" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:9px;fill:#8C8C8C;font-style:italic"><tspan x="50">image: UXPin, Viget Labs</tspan></text></g><g clip-path="url(#clip47)"><text y="807" text-anchor="end" dominant-baseline="central" style="font-family:MiloOT, Helvetica Neue, Arial, sans-serif;font-size:11px;fill:#2BB0C4"><tspan x="545">19</tspan></text></g></g></svg>
